# Verification for the GMP 6.3.0 Zig package.
#
# Written for this fork. Upstream GMP ships no CI configuration that could be
# reused, and none is imported: this workflow only runs this repository's own
# steps.
#
# Every prefix here is under `$RUNNER_TEMP`, the runner's own scratch root,
# which is outside `$GITHUB_WORKSPACE`. Zig's default prefix is `<package
# root>/zig-out`, so a step that installs without naming one writes this SDK's
# tree into the checkout; `test`, `smoke`, `check` and `cross` install nothing
# and name none.

name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Licence and provenance first: it needs no compiler and it is the check
      # that must never be skipped.
      - name: Licence and provenance gate
        run: sh tools/provenance_gate.sh .

      - name: Formatting
        run: zig fmt --check build.zig build.zig.zon root.zig zig consumer

      - name: Build
        run: zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/gmp-install"

      - name: Tests (Debug)
        run: zig build test -Doptimize=Debug

      - name: Tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: Smoke run
        run: zig build smoke -Doptimize=ReleaseSafe

      - name: Consumer package
        working-directory: consumer
        run: zig build run -Doptimize=ReleaseSafe

  shared:
    name: shared library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The same gates as `verify`, against the artifact `-Dlinkage=dynamic`
      # produces: PIC objects, libtool's soname, and a gmp.h whose public
      # declarations are imported rather than left empty.
      - name: Install the shared library
        run: zig build install -Dlinkage=dynamic -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/gmp-install" --summary all
      - name: Tests (Debug)
        run: zig build test -Dlinkage=dynamic -Doptimize=Debug
      - name: Tests (ReleaseSafe)
        run: zig build test -Dlinkage=dynamic -Doptimize=ReleaseSafe
      - name: Smoke run
        run: zig build smoke -Dlinkage=dynamic -Doptimize=ReleaseSafe
      - name: Consumer package against the shared library
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic -Doptimize=ReleaseSafe

  runtime:
    name: runtime-loaded (${{ matrix.linkage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linkage:
          - static
          - dynamic
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The route where GMP is loaded rather than linked. Every GMP call goes
      # through the generated dispatch, so a mistake in the loader, the dispatch
      # or the provider contract fails here and nowhere else. The two linkages
      # are both exercised deliberately and neither cell may pass without a
      # provider: a runtime-loading build that was told nothing reports
      # `NoProviderConfigured` (zig/provider.zig:34,81-89), so a cell with no
      # provider here fails at its first run rather than quietly proving
      # nothing about the route it claims to check.
      #
      # The provider is built separately, into a prefix of its own, in *both*
      # cells. It has to be a real shared object either way, and in the static
      # cell nothing this package installs could serve: that cell installs
      # `libgmp.a`, which no platform loader can open. Building it the same way
      # in both cells is what makes the pair a matrix rather than a repeat:
      # what differs is what the tests link, not what they load. Its prefix is
      # the runner's scratch root, separate from this package's own install
      # prefix, so nothing a later install step writes can disturb it.
      - name: Build the shared provider
        run: zig build -Dlinkage=dynamic -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/gmp-provider" --summary all
      # `GMP_TEST_PROVIDER` is the one name `zig/provider.zig` reads, and it is
      # what the test binary, the example and the consumer package all answer
      # to, so one step exports it for every later step in the cell. The file
      # name is libtool's own (`Makefile.am:107-109`, `build.zig:88`), and the
      # check below is a build failure with a message, not a fallback: a
      # missing provider never turns into another path being tried.
      - name: Name the provider
        run: |
          provider="$RUNNER_TEMP/gmp-provider/lib/libgmp.so.10.5.0"
          if [ ! -f "$provider" ]; then
            printf 'runtime-loaded: no shared provider at %s\n' "$provider" >&2
            exit 1
          fi
          printf 'GMP_TEST_PROVIDER=%s\n' "$provider" >> "$GITHUB_ENV"
      - name: Install the package
        run: zig build install -Druntime=true -Dlinkage=${{ matrix.linkage }} -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/gmp-install" --summary all
      - name: Tests (Debug)
        run: zig build test -Druntime=true -Dlinkage=${{ matrix.linkage }} -Doptimize=Debug
      - name: Tests (ReleaseSafe)
        run: zig build test -Druntime=true -Dlinkage=${{ matrix.linkage }} -Doptimize=ReleaseSafe
      - name: Smoke run
        run: zig build smoke -Druntime=true -Dlinkage=${{ matrix.linkage }} -Doptimize=ReleaseSafe
      - name: Consumer package
        working-directory: consumer
        run: zig build run -Druntime=true -Dlinkage=${{ matrix.linkage }} -Doptimize=ReleaseSafe

  cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - aarch64-macos-none
          - x86_64-windows-gnu
          - riscv64-linux-gnu
          - wasm32-wasi
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # One job per target so a failure names the target that failed. Nothing
      # cross compiled is run here.
      - name: Compile the library, the facade, the tests and the example
        # wasm32-wasi has no signal support in its libc: invalid.c raises
        # SIGFPE (src/invalid.c:80) and Makefile.am:285 compiles that file
        # unconditionally, so the wasi signal.h refuses to be included. Keep
        # the attempt visible; this does not claim WebAssembly support.
        continue-on-error: ${{ matrix.target == 'wasm32-wasi' }}
        run: zig build check -Dtarget=${{ matrix.target }} --summary all

